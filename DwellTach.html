		    { x: boundsNok.x + boundsNok.width, y: boundsNok.y },
		    { x: boundsNok.x + boundsNok.width, y: boundsNok.y + boundsNok.height },
		    { x: boundsNok.x, y: boundsNok.y + boundsNok.height }
		];
		// ==========================================

		// ==========================================
		this.addEventListener("tick", jalankanMekanismePlatina.bind(this));
		function jalankanMekanismePlatina() {
		    // ==========================================
		    // 1. PUTAR NOK DENGAN KECEPATAN SLIDER 1
		    // ==========================================
		    var kecepatan = (
		        this.parent &&
		        this.parent.kecepatanNok !== undefined
		    )
		    ? this.parent.kecepatanNok
		    : 0;
		    this.nok.rotation += kecepatan;
		    // ==========================================
		    // 2. DAPATKAN POSISI GLOBAL TUMIT & PUSAT
		    // ==========================================
		    var posTumit = this.lengan.tumit.localToGlobal(
		        tengahTumitLokal.x,
		        tengahTumitLokal.y
		    );
		    // ==========================================
		    // 3. CARI JARAK TERDEKAT SIKU NOK KE TUMIT
		    // ==========================================
		    var jarakTerdekat = 30;
		    // RADIUS DIPERBESAR SUPAYA KECEPATAN TINGGI
		    // TIDAK TERLOMPAT
		    var jangkauanDeteksi = 25;
		    for (var j = 0; j < pNokLokal.length; j++) {
		        var pNokGlobal = this.nok.localToGlobal(
		            pNokLokal[j].x,
		            pNokLokal[j].y
		        );
		        var dx = pNokGlobal.x - posTumit.x;
		        var dy = pNokGlobal.y - posTumit.y;
		        var d = Math.sqrt(
		            dx * dx +
		            dy * dy
		        );
		        if (d < jarakTerdekat) {
		            jarakTerdekat = d;
		        }
		    }
		    // ==========================================
		    // 4. HITUNG ANGKATAN LENGAN
		    // ==========================================
		    var targetSudut = sudutAwalLengan;
		    if (jarakTerdekat < jangkauanDeteksi) {
		        // 0 = jauh
		        // 1 = NOK sangat dekat / menekan tumit
		        var faktorDekat =
		            1 - (jarakTerdekat / jangkauanDeteksi);
		        // ==========================================
		        // AMBIL MAKSIMAL ANGKAT DARI SLIDER 2
		        // ==========================================
		        var maksAngkat = (

		        )

		            (faktorDekat * maksAngkat);
		    }

		    // 5. SET ROTASI LENGAN
		    // ==========================================
		    this.lengan.rotation = targetSudut;
		    // ==========================================
		    // 6. KUNCI POSISI LENGAN
		    // ==========================================
		    // Jangan lagi menggunakan:
		    //
		    // localToGlobal()
		    // posPusatGlobalAwal
		    // posPusatSekarang
		    // x += selisihGlobal
		    // y += selisihGlobal
		    //
		    // Karena perubahan transformasi canvas saat

		    // posisi global tersebut menyebabkan lengan
		    // berpindah.
		    //
		    // Sekarang x/y selalu kembali ke posisi awal.
		    this.lengan.x = posisiAwalLenganX;
		    this.lengan.y = posisiAwalLenganY;
		}

		function sliderKeDerajat(rasio) {
		    // 45° ke -45°
		    var degrees =
		        45 - (rasio * 90);
		    return degrees;
		}
		// =====================================================
		// ROTASI → SLIDER
		// =====================================================
		function derajatKeSlider(degrees) {
		    // Ubah 315° menjadi -45°
		    if (degrees > 180) {
		        degrees -= 360;
		    }
		    // Batas asli
		    if (degrees > 45) {
		        degrees = 45;
		    }
		    if (degrees < -45) {
		        degrees = -45;
		    }
		    // 45° = kiri
		    // -45° = kanan
		    var rasio =
		        (45 - degrees) / 90;
		    if (rasio < 0) {
		        rasio = 0;
		    }
		    if (rasio > 1) {
		        rasio = 1;
		    }
		    return rasio;
		}

		var targetRotation =
		    jarum.rotation;

		var currentRotation =
		    jarum.rotation;

		// GETARAN
		// =====================================================
		var getaranTime = 0;
		// =====================================================
		// KONVERSI ROTASI KE BENTUK -45 s/d 45
		// =====================================================
		function rotasiNormal(degrees) {
		    while (degrees > 180) {
		        degrees -= 360;
		    }
		    while (degrees < -180) {
		        degrees += 360;
		    }
		    return degrees;
		}
		// =====================================================
		// SELISIH SUDUT
		// =====================================================
		function selisihSudut(a, b) {
		    var d = b - a;
		    while (d > 180) {
		        d -= 360;
		    }
		    while (d < -180) {
		        d += 360;
		    }
		    return d;
		}

		    // =================================================

		    // =================================================
		    currentRotation +=
		        selisih * 0.16;
		    // =================================================
		    // GETARAN
		    // =================================================
		    getaranTime += 0.45;
		    var getaran =
		        Math.sin(getaranTime) * 0.5;
		    // =================================================
		    // POSISI VISUAL JARUM
		    // =================================================
		    var visualRotation =
		        currentRotation + getaran;
		    // =================================================
		    // RANGE TETAP
		    // =================================================
		    if (visualRotation > 45) {
		        visualRotation = 45;
		    }
		    if (visualRotation < -45) {
		        visualRotation = -45;
		    }
		    jarum.rotation =
		        visualRotation;
		    // =================================================
		    // UPDATE NILAI
		    // =================================================
		    calculateAndUpdate(
		        rotasiNormal(jarum.rotation)
		    );

		    // NOK BERPUTAR TERUS
		    // KECEPATAN BERDASARKAN SLIDER 1
		    // =================================================
		    updateNok();
		    // =================================================

		    if (degrees >= 45 && degrees <= 315) {

		            degrees < 180

		    // =================================================

		    // =================================================
